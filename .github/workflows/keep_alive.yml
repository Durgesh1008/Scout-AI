name: Render Keep-Alive Ping

on:
  schedule:
    # Run every 14 minutes to prevent Render Free Tier from spinning down
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s -f https://scout-ai-1-0gs9.onrender.com/api/health || true
